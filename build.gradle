plugins {
  id 'java'
  id 'war'
}

group 'site.benepay'
version '1.0-SNAPSHOT'

repositories {
  mavenCentral()
}

ext {
  junitVersion = '5.11.0'
  springVersion = '5.3.39'
  springSecurityVersion = '5.8.11'
  mockitoVersion = '4.11.0'
}

sourceCompatibility = '17'
targetCompatibility = '17'

tasks.withType(JavaCompile) {
  options.encoding = 'UTF-8'
}

dependencies {
  compileOnly('javax.json:javax.json-api:1.1.4')
  compileOnly('javax.servlet:javax.servlet-api:4.0.1')
  compileOnly('javax.websocket:javax.websocket-api:1.1')

  implementation("org.springframework:spring-webmvc:${springVersion}")
  implementation("org.springframework:spring-context:${springVersion}")
  implementation("org.springframework:spring-tx:${springVersion}")
  implementation("org.springframework:spring-jdbc:${springVersion}")

  implementation("org.springframework.security:spring-security-web:${springSecurityVersion}")
  implementation("org.springframework.security:spring-security-config:${springSecurityVersion}")

  implementation('org.mybatis:mybatis:3.5.16')
  implementation('org.mybatis:mybatis-spring:2.1.2')

  implementation('com.mysql:mysql-connector-j:8.3.0')
  implementation('com.zaxxer:HikariCP:4.0.3')

  implementation('io.jsonwebtoken:jjwt-api:0.11.5')
  runtimeOnly('io.jsonwebtoken:jjwt-impl:0.11.5')
  runtimeOnly('io.jsonwebtoken:jjwt-jackson:0.11.5')

  implementation('org.springframework.data:spring-data-redis:2.7.18')
  implementation('io.lettuce:lettuce-core:6.1.10.RELEASE')

  implementation('com.fasterxml.jackson.core:jackson-databind:2.15.4')
  implementation('com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.4')

  implementation('javax.validation:validation-api:2.0.1.Final')
  implementation('org.hibernate.validator:hibernate-validator:6.2.5.Final')
  implementation('org.glassfish:javax.el:3.0.1-b11')

  implementation('org.slf4j:slf4j-api:1.7.36')
  runtimeOnly('ch.qos.logback:logback-classic:1.2.13')

  implementation('javax.annotation:javax.annotation-api:1.3.2')

  compileOnly('org.projectlombok:lombok:1.18.30')
  annotationProcessor('org.projectlombok:lombok:1.18.30')

  testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
  testImplementation("org.junit.jupiter:junit-jupiter-params:${junitVersion}")
  testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")

  testImplementation("org.mockito:mockito-core:${mockitoVersion}")
  testImplementation("org.mockito:mockito-junit-jupiter:${mockitoVersion}")
  testImplementation('org.assertj:assertj-core:3.24.2')
}

test {
useJUnitPlatform()}