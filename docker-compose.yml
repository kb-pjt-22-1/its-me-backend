version: '3.7'

networks:
  kong-net:
    driver: bridge

services:
  # 1. Kong 전용 DB (PostgreSQL)
  kong-database:
    image: postgres:13
    container_name: kong-database
    networks:
      - kong-net
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kongpassword
    ports:
      - '5432:5432' # 로컬의 5432 포트가 이미 사용 중이라면 "5433:5432"로 변경하세요.

  # 2. Kong DB 마이그레이션 (최초 1회 실행 후 자동 종료됨)
  kong-migration:
    image: kong:latest
    container_name: kong-migration
    networks:
      - kong-net
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kongpassword
    command: kong migrations bootstrap
    depends_on:
      - kong-database

  # 3. Kong API Gateway 본체
  kong:
    image: kong:latest
    container_name: kong
    networks:
      - kong-net
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kongpassword
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
    ports:
      - '8000:8000' # 프론트엔드가 요청할 Gateway 포트
      - '8001:8001' # Kong 관리용 Admin API 포트
    depends_on:
      - kong-migration

  # 4. Konga (웹 GUI 대시보드 - 내장 DB 사용)
  konga:
    image: pantsel/konga:latest
    container_name: konga
    networks:
      - kong-net
    ports:
      - '1337:1337'
    environment:
      NODE_ENV: production
    depends_on:
      - kong
