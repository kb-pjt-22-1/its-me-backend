networks:
  kong-net:
    driver: bridge

services:
  nginx:
    image: jonasal/nginx-certbot:latest
    profiles: ["prod"]
    restart: unless-stopped
    environment:
      - CERTBOT_EMAIL=${CERTBOT_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx_secrets:/etc/letsencrypt
      - ./docker/nginx/user_conf.d:/etc/nginx/user_conf.d:ro
    depends_on:
      - app
      - frontend

  app:
    image: ghcr.io/kb-pjt-22-1/its-me-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_NAME: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: ghcr.io/kb-pjt-22-1/its-me-frontend:${FRONTEND_IMAGE_TAG:-latest}
    restart: unless-stopped

  # 로컬 전용 (TLS 없음). benepay.site 실제 인증서가 없는 로컬 환경에서
  # 운영용 nginx 대신 app/frontend를 라우팅합니다.
  #   docker compose --profile local up -d
  #   접속: http://localhost:8080  (/api/* -> app, 그 외 -> frontend)
  local-nginx:
    image: nginx:alpine
    profiles: ["local"]
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - frontend

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  redis-data:
  nginx_secrets:
