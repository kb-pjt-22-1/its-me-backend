<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1"
    >

    <title>BenePay 결제</title>

    <link rel="stylesheet" href="assets/app.css">
</head>

<body>

<div class="app-shell">

    <!-- 상단 헤더 -->
    <header class="page-header">

        <div class="page-title" id="pageTitle">
            결제
        </div>

        <div class="header-actions">
            <button class="icon-button">♧</button>
            <div class="mini-grid">▦</div>
        </div>

    </header>


    <main class="pay-content">

        <!--
          북마크 매장 결제로 들어왔을 때만 표시됨.
          URL에 merchantId가 없으면 영역 전체가 숨겨짐.
        -->
        <section
                id="merchantSection"
                class="surface merchant-summary hidden"
        >

            <div class="eyebrow">
                결제 매장
            </div>

            <h2 id="merchantName">
                매장 정보를 불러오는 중...
            </h2>

            <div
                    id="merchantMeta"
                    class="card-meta"
            ></div>

            <div class="amount-row">

        <span class="eyebrow">
          결제 예정 금액
        </span>

                <label>
                    <input
                            id="amountInput"
                            class="amount-field"
                            inputmode="numeric"
                            value="10000"
                    >
                    원
                </label>

            </div>

        </section>


        <!-- PIN 인증 전 화면 -->
        <section
                id="lockPanel"
                class="surface lock-panel"
        >

            <div class="lock-circle">
                ▢
            </div>

            <h2 id="lockTitle">
                간편 결제
            </h2>

            <p>
                PIN 인증 후 바코드가 표시됩니다
            </p>

        </section>


        <!-- 결제 코드 발급 후 화면 -->
        <section
                id="codePanel"
                class="surface code-panel hidden"
        >

            <div class="code-card-head">

                <div class="eyebrow">
                    일반 결제
                </div>

                <div
                        class="card-name"
                        id="codeCardName"
                ></div>

                <div
                        class="card-meta"
                        id="codeCardMeta"
                ></div>

            </div>


            <div
                    id="codeArea"
                    class="code-area"
            >

                <img
                        id="codeImage"
                        alt="결제 코드"
                >

                <div
                        id="displayCode"
                        class="display-code"
                ></div>


                <div class="segmented">

                    <button
                            id="barcodeTab"
                            class="active"
                            type="button"
                    >
                        바코드
                    </button>

                    <button
                            id="qrTab"
                            type="button"
                    >
                        QR
                    </button>


                </div>


                <button
                        id="reissueButton"
                        class="reissue"
                        type="button"
                >
                    ↻ 바코드 재발급
                </button>

                <div
                        id="timer"
                        class="code-timer"
                ></div>

                <p class="safe-note">
                    안전한 결제를 위해 결제 코드는 주기적으로 변경됩니다.
                </p>

            </div>

        </section>


        <!-- 카드 목록 -->
        <section class="section">

            <div class="section-title-row">

                <div
                        class="section-title"
                        id="cardsTitle"
                >
                    결제 수단
                </div>

                <span
                        id="recommendBasis"
                        class="section-link hidden"
                >
          혜택 추천 기준
        </span>

            </div>


            <div
                    id="cardList"
                    class="card-list"
            >
                <div class="loading">
                    카드 정보를 불러오는 중...
                </div>
            </div>


            <div
                    id="recommendMessage"
                    class="recommend-message hidden"
            ></div>


            <div class="info-box">
                ⓘ 결제 완료 후 카드 실적과 적립 한도가 자동으로 업데이트됩니다.
            </div>

        </section>

    </main>


    <!-- 하단 결제 버튼 -->
    <div class="sticky-action">

        <button
                id="mainAction"
                class="primary-button"
                type="button"
                disabled
        >
            PIN 인증 후 결제하기
        </button>

    </div>


    <nav
            id="bottomNav"
            class="bottom-nav"
    ></nav>

</div>


<!-- PIN 인증 모달 -->
<div
        id="pinModal"
        class="modal-backdrop hidden"
>

    <div class="modal">

        <div style="font-size: 30px">
            ▢
        </div>

        <h2>
            PIN 인증
        </h2>

        <p>
            데모 PIN은 123456입니다
        </p>

        <input
                id="pinInput"
                class="pin-input"
                type="password"
                inputmode="numeric"
                maxlength="6"
                autocomplete="off"
                placeholder="••••••"
        >

        <div class="modal-actions">

            <button
                    id="pinCancel"
                    class="secondary-button"
                    type="button"
            >
                취소
            </button>

            <button
                    id="pinConfirm"
                    class="primary-button"
                    type="button"
            >
                인증하고 발급
            </button>

        </div>

    </div>

</div>


<!-- 결제 결과 모달 -->
<div
        id="resultModal"
        class="modal-backdrop hidden"
>

    <div class="modal">

        <div
                id="resultIcon"
                class="success-icon"
        >
            ✓
        </div>

        <h2 id="resultTitle">
            결제가 완료되었습니다
        </h2>

        <div
                id="resultBox"
                class="result-box"
        ></div>

        <button
                id="resultConfirm"
                class="primary-button"
                type="button"
        >
            확인
        </button>

    </div>

</div>


<script src="assets/common.js"></script>

<script>

    const state = {
        merchants: [],
        merchant: null,
        amount: 0,
        cards: [],
        selectedCardId: null,
        recommendedCardId: null,
        token: null,
        mode: 'barcode',
        poll: null,
        countdown: null,
        payment: null,
        generalMode: true
    };


    const amountInput =
        document.getElementById('amountInput');

    const mainAction =
        document.getElementById('mainAction');


    /*
     * 페이지 최초 실행
     *
     * pay.html
     * → 일반 간편결제
     *
     * pay.html?merchantId=3&amount=4800
     * → 3번 매장으로 고정된 북마크 결제
     */
    (async function initializePage() {

        try {

            state.merchants =
                await api('/api/v1/merchants');


            const requestedMerchantId =
                Number(query('merchantId', 0));


            /*
             * URL로 전달된 merchantId와 일치하는
             * 매장 하나만 찾음.
             *
             * 첫 번째 매장을 자동 선택하지 않음.
             */
            state.merchant =
                requestedMerchantId > 0
                    ? state.merchants.find(
                        merchant =>
                            Number(merchant.merchantId) ===
                            requestedMerchantId
                    )
                    : null;


            /*
             * merchantId가 전달됐지만
             * 실제 매장이 없는 경우 오류 처리
             */
            if (
                requestedMerchantId > 0 &&
                !state.merchant
            ) {
                throw new Error(
                    '북마크한 매장 정보를 찾을 수 없습니다.'
                );
            }


            /*
             * 매장이 있으면 북마크 매장 결제,
             * 매장이 없으면 일반 간편결제
             */
            state.generalMode =
                state.merchant === null;


            /*
             * 북마크 매장 결제인 경우
             * 전달받은 금액 또는 기본 금액 설정
             */
            if (state.merchant) {

                state.amount = Number(
                    query(
                        'amount',
                        merchantDefaultAmount(state.merchant)
                    )
                );

                amountInput.value =
                    String(state.amount);
            }


            renderMerchant();

            await loadCards();

        } catch (error) {

            showToast(
                error.message,
                'error'
            );

            document.getElementById(
                'cardList'
            ).innerHTML = `
        <div class="empty-state">
          ${escapeHtml(error.message)}
        </div>
      `;

        }

        pageReady('pay');

    })();


    /*
     * 매장 정보 화면 표시
     */
    function renderMerchant() {

        const merchantSection =
            document.getElementById('merchantSection');

        const recommendBasis =
            document.getElementById('recommendBasis');


        /*
         * 일반 결제일 경우
         * 매장 정보 영역 전체 숨김
         */
        if (state.generalMode) {

            merchantSection.classList.add('hidden');

            recommendBasis.classList.add('hidden');

            document.getElementById(
                'pageTitle'
            ).textContent = '결제';

            document.getElementById(
                'cardsTitle'
            ).textContent = '결제 수단';

            document.getElementById(
                'lockTitle'
            ).textContent = '간편 결제';

            return;
        }


        /*
         * 북마크 매장 결제일 경우
         * URL로 전달받은 매장만 표시
         */
        merchantSection.classList.remove('hidden');

        recommendBasis.classList.remove('hidden');

        document.getElementById(
            'pageTitle'
        ).textContent = '결제하기';

        document.getElementById(
            'cardsTitle'
        ).textContent =
            '이 매장 추천 결제 카드';

        document.getElementById(
            'lockTitle'
        ).textContent =
            state.merchant.merchantName;

        document.getElementById(
            'merchantName'
        ).textContent =
            state.merchant.merchantName;

        document.getElementById(
            'merchantMeta'
        ).textContent =
            `${state.merchant.categoryName} · ` +
            `${state.merchant.address}`;
    }


    /*
     * 일반 결제 카드 또는
     * 매장 추천 카드 조회
     */
    async function loadCards() {

        clearToken();

        const cardList =
            document.getElementById('cardList');

        cardList.innerHTML = `
      <div class="loading">
        카드 정보를 불러오는 중...
      </div>
    `;

        mainAction.disabled = true;


        try {

            /*
             * 일반 간편결제
             */
            if (state.generalMode) {

                const cards =
                    await api('/api/v1/cards');

                state.cards =
                    (cards || []).map(card => ({
                        ...card,
                        expectedDiscount: 0,
                        expectedReward: 0,
                        expectedBenefit: 0,
                        benefitName: ''
                    }));


                const primaryCard =
                    state.cards.find(
                        card => card.primary
                    ) || state.cards[0];


                state.selectedCardId =
                    primaryCard
                        ? Number(primaryCard.userCardId)
                        : null;


                state.recommendedCardId = null;

            }

            /*
             * 북마크 매장 결제
             */
            else {

                state.amount = Number(
                    String(amountInput.value)
                        .replace(/\D/g, '')
                );


                if (state.amount < 1) {
                    throw new Error(
                        '결제 금액을 입력해주세요.'
                    );
                }


                const recommendation =
                    await api(
                        `/api/v1/recommend` +
                        `?merchantId=${state.merchant.merchantId}` +
                        `&amount=${state.amount}`
                    );


                state.cards =
                    recommendation.cards || [];


                state.recommendedCardId =
                    Number(
                        recommendation.recommendedCardId
                    );


                state.selectedCardId =
                    state.recommendedCardId;
            }


            renderCards();

            mainAction.disabled =
                !state.selectedCardId;

        } catch (error) {

            cardList.innerHTML = `
        <div class="empty-state">
          ${escapeHtml(error.message)}
        </div>
      `;

            showToast(
                error.message,
                'error'
            );
        }
    }


    /*
     * 일반 결제 카드 혜택 문구
     */
    function getGeneralBenefitLabel(card) {

        const cardName =
            String(card.cardName || '')
                .toLowerCase();


        if (
            cardName.includes('deep dream')
        ) {
            return '5% 캐시백';
        }


        if (
            cardName.includes('the more')
        ) {
            return '3% 적립';
        }


        if (
            cardName.includes('cashback')
        ) {
            return '0.3% 캐시백';
        }


        if (card.primary) {
            return '대표 카드';
        }


        return card.cardType === 'CHECK'
            ? '체크카드'
            : '신용카드';
    }


    /*
     * 카드 목록 출력
     */
    function renderCards() {

        const cardList =
            document.getElementById('cardList');


        if (!state.cards.length) {

            cardList.innerHTML = `
        <div class="empty-state">
          등록된 카드가 없습니다.
        </div>
      `;

            mainAction.disabled = true;

            return;
        }


        cardList.innerHTML =
            state.cards.map(
                (card, index) => {

                    const selected =
                        Number(card.userCardId) ===
                        Number(state.selectedCardId);


                    const recommended =
                        !state.generalMode &&
                        Number(card.userCardId) ===
                        Number(state.recommendedCardId);


                    let benefitLabel;


                    if (state.generalMode) {

                        benefitLabel =
                            getGeneralBenefitLabel(card);

                    } else if (
                        Number(card.expectedDiscount) > 0
                    ) {

                        benefitLabel =
                            `${Number(
                                card.expectedDiscount /
                                state.amount *
                                100
                            ).toFixed(0)}% 할인`;

                    } else if (
                        Number(card.expectedReward) > 0
                    ) {

                        benefitLabel =
                            `${Number(
                                card.expectedReward /
                                state.amount *
                                100
                            ).toFixed(1)}% 적립`;

                    } else {

                        benefitLabel =
                            '혜택 없음';
                    }


                    let cardTag = '';


                    if (
                        state.generalMode &&
                        card.primary
                    ) {

                        cardTag = `
              <span
                class="recommend-tag"
                style="
                  background:#e8f8f3;
                  color:#0aa57a;
                "
              >
                대표
              </span>
            `;

                    } else if (recommended) {

                        cardTag = `
              <span class="recommend-tag">
                추천
              </span>
            `;
                    }


                    const benefitDetail =
                        !state.generalMode &&
                        card.benefitName
                            ? `
                  <br>
                  ${escapeHtml(card.benefitName)}
                `
                            : '';


                    return `
            <button
              type="button"
              class="
                pay-card-option
                ${selected ? 'selected' : ''}
              "
              data-card="${card.userCardId}"
            >

              <div
                class="
                  card-color
                  ${index === 1 ? 'blue' : ''}
                  ${index === 2 ? 'navy' : ''}
                "
              ></div>


              <div style="text-align:left">

                <div class="name">
                  ${cardTag}
                  ${escapeHtml(card.cardName)}
                </div>

                <div class="meta">
                  •••• ${escapeHtml(card.cardLast4)}
                  ${benefitDetail}
                </div>

              </div>


              <div
                style="
                  display:flex;
                  align-items:center;
                "
              >

                <span class="benefit">
                  ${benefitLabel}
                </span>

                ${
                        selected
                            ? `
                      <span class="check">
                        ✓
                      </span>
                    `
                            : ''
                    }

              </div>

            </button>
          `;
                }
            ).join('');


        /*
         * 카드 선택 이벤트
         */
        cardList
            .querySelectorAll('[data-card]')
            .forEach(button => {

                button.onclick = () => {

                    if (state.token) {

                        showToast(
                            '발급된 결제 코드를 먼저 사용하거나 재발급하세요.'
                        );

                        return;
                    }


                    state.selectedCardId =
                        Number(button.dataset.card);


                    renderCards();

                    renderRecommendMessage();
                };
            });


        renderRecommendMessage();
    }


    /*
     * 북마크 매장 추천 혜택 문구
     */
    function renderRecommendMessage() {

        const messageBox =
            document.getElementById(
                'recommendMessage'
            );


        if (state.generalMode) {

            messageBox.classList.add('hidden');

            return;
        }


        const selectedCard =
            state.cards.find(
                card =>
                    Number(card.userCardId) ===
                    Number(state.selectedCardId)
            );


        if (
            !selectedCard ||
            Number(
                selectedCard.expectedBenefit || 0
            ) <= 0
        ) {

            messageBox.classList.add('hidden');

            return;
        }


        messageBox.textContent =
            `이 카드로 결제하면 예상 ` +
            `${selectedCard.benefitName || '혜택'} ` +
            `${won(selectedCard.expectedBenefit)}` +
            `을 받을 수 있어요.`;


        messageBox.classList.remove('hidden');
    }


    /*
     * 발급된 토큰 화면 초기화
     */
    function clearToken() {

        state.token = null;

        state.payment = null;

        clearInterval(state.poll);

        clearInterval(state.countdown);


        document.getElementById(
            'codePanel'
        ).classList.add('hidden');


        document.getElementById(
            'lockPanel'
        ).classList.remove('hidden');


        mainAction.textContent =
            'PIN 인증 후 결제하기';
    }


    /*
     * PIN 모달 열기
     */
    function openPin() {

        document.getElementById(
            'pinModal'
        ).classList.remove('hidden');


        setTimeout(() => {

            document.getElementById(
                'pinInput'
            ).focus();

        }, 100);
    }


    /*
     * PIN 모달 닫기
     */
    function closePin() {

        document.getElementById(
            'pinModal'
        ).classList.add('hidden');


        document.getElementById(
            'pinInput'
        ).value = '';
    }


    /*
     * PIN 인증 후 결제 토큰 발급
     */
    async function verifyAndIssue() {

        const pin =
            document.getElementById(
                'pinInput'
            ).value;


        if (!/^\d{6}$/.test(pin)) {

            showToast(
                'PIN 숫자 6자리를 입력하세요.',
                'error'
            );

            return;
        }


        const confirmButton =
            document.getElementById(
                'pinConfirm'
            );


        setButtonLoading(
            confirmButton,
            true,
            '인증 중...'
        );


        try {

            await api(
                '/api/v1/auth/pin/verify',
                {
                    method: 'POST',
                    body: JSON.stringify({
                        pin: pin
                    })
                }
            );


            closePin();

            await issueToken();

        } catch (error) {

            showToast(
                error.message,
                'error'
            );

        } finally {

            setButtonLoading(
                confirmButton,
                false
            );
        }
    }


    /*
     * 결제 토큰 발급
     */
    async function issueToken() {

        try {

            const requestBody = {
                userCardId:
                state.selectedCardId
            };


            /*
             * 북마크 매장 결제일 때만
             * 매장과 금액을 토큰에 연결
             */
            if (!state.generalMode) {

                requestBody.merchantId =
                    state.merchant.merchantId;

                requestBody.amount =
                    state.amount;
            }


            const tokenData =
                await api(
                    '/api/v1/payment-tokens',
                    {
                        method: 'POST',
                        body: JSON.stringify(
                            requestBody
                        )
                    }
                );


            state.token =
                tokenData;

            state.mode =
                'barcode';


            showCode();

            startPolling();


            showToast(
                '결제 코드가 발급되었습니다.',
                'success'
            );

        } catch (error) {

            if (
                error.code ===
                'PIN_AUTH_REQUIRED' ||
                error.code ===
                'PIN_AUTH_EXPIRED'
            ) {

                openPin();

                return;
            }


            showToast(
                error.message,
                'error'
            );
        }
    }


    /*
     * 바코드·QR 화면 출력
     */
    function showCode() {

        document.getElementById(
            'lockPanel'
        ).classList.add('hidden');


        document.getElementById(
            'codePanel'
        ).classList.remove('hidden');


        document.getElementById(
            'codeCardName'
        ).textContent =
            state.token.cardName;


        document.getElementById(
            'codeCardMeta'
        ).textContent =
            `${state.token.cardCompanyName} · ` +
            `•••• ${state.token.cardLast4}`;


        document.getElementById(
            'displayCode'
        ).textContent =
            String(
                state.token.displayCode || ''
            ).replace(
                /(\d{4})(\d{4})(\d{4})(\d{2})/,
                '$1 $2 $3 $4'
            );


        renderCode();

        startCountdown(
            state.token.expiresInSeconds
        );


        mainAction.textContent =
            '결제하기';
    }


    /*
     * 바코드 또는 QR 선택
     */
    function renderCode() {

        const codeArea =
            document.getElementById(
                'codeArea'
            );


        document.getElementById(
            'codeImage'
        ).src =
            state.mode === 'qr'
                ? state.token.qrImage
                : state.token.barcodeImage;


        codeArea.classList.toggle(
            'qr',
            state.mode === 'qr'
        );


        document.getElementById(
            'barcodeTab'
        ).classList.toggle(
            'active',
            state.mode === 'barcode'
        );


        document.getElementById(
            'qrTab'
        ).classList.toggle(
            'active',
            state.mode === 'qr'
        );


        document.getElementById(
            'reissueButton'
        ).textContent =
            state.mode === 'qr'
                ? '↻ QR 재발급'
                : '↻ 바코드 재발급';
    }


    /*
     * 결제 코드 남은 시간
     */
    function startCountdown(seconds) {

        clearInterval(
            state.countdown
        );


        let remain =
            Number(seconds || 60);


        const timerElement =
            document.getElementById(
                'timer'
            );


        timerElement.textContent =
            `유효시간 ${remain}초`;


        state.countdown =
            setInterval(() => {

                remain--;


                timerElement.textContent =
                    remain > 0
                        ? `유효시간 ${remain}초`
                        : '결제 코드가 만료되었습니다.';


                if (remain <= 0) {

                    clearInterval(
                        state.countdown
                    );
                }

            }, 1000);
    }


    /*
     * POS 결제 결과 조회
     */
    function startPolling() {

        clearInterval(
            state.poll
        );


        state.poll =
            setInterval(async () => {

                if (!state.token) {
                    return;
                }


                try {

                    const result =
                        await api(
                            `/api/v1/payment-tokens/` +
                            `${state.token.paymentTokenId}`
                        );


                    if (result.payment) {

                        clearInterval(
                            state.poll
                        );

                        showResult(
                            result.payment
                        );

                    } else if (
                        result.tokenStatus ===
                        'EXPIRED'
                    ) {

                        clearInterval(
                            state.poll
                        );

                        showToast(
                            '결제 코드가 만료되었습니다. 재발급해주세요.',
                            'error'
                        );
                    }

                } catch (error) {

                    clearInterval(
                        state.poll
                    );
                }

            }, 1200);
    }

    async function approvePayment() {

        if (!state.token) {
            openPin();
            return;
        }

        /*
         * 북마크 결제면 해당 매장을 사용하고,
         * 일반 결제면 DB에서 조회한 첫 번째 매장을
         * 임시 매장으로 사용한다.
         */
        const merchantId =
            state.merchant
                ? Number(state.merchant.merchantId)
                : state.merchants.length > 0
                    ? Number(state.merchants[0].merchantId)
                    : null;


        /*
         * 일반 결제는 10,000원으로 가정한다.
         * 북마크 결제는 화면에서 입력한 금액을 사용한다.
         */
        const paymentAmount =
            state.generalMode
                ? 10000
                : Number(
                    String(amountInput.value || '')
                        .replace(/\D/g, '')
                );


        if (!merchantId) {
            showToast(
                '결제에 사용할 기본 매장 데이터가 없습니다.',
                'error'
            );
            return;
        }


        if (!paymentAmount || paymentAmount < 1) {
            showToast(
                '올바른 결제 금액을 입력해주세요.',
                'error'
            );
            return;
        }


        state.amount = paymentAmount;


        setButtonLoading(
            mainAction,
            true,
            '결제 승인 중...'
        );


        try {

            const posRequestId =
                window.crypto &&
                typeof window.crypto.randomUUID === 'function'
                    ? `WEB-${window.crypto.randomUUID()}`
                    : `WEB-${Date.now()}-${Math.floor(
                        Math.random() * 100000
                    )}`;


            const payment =
                await api(
                    '/api/v1/pos/payments',
                    {
                        method: 'POST',

                        body: JSON.stringify({
                            paymentToken:
                            state.token.paymentToken,

                            merchantId:
                            merchantId,

                            amount:
                            paymentAmount,

                            posRequestId:
                            posRequestId,

                            simulateFailure:
                                false
                        })
                    }
                );


            showResult(payment);

        } catch (error) {

            showToast(
                error.message ||
                '결제 처리에 실패했습니다.',
                'error'
            );

        } finally {

            setButtonLoading(
                mainAction,
                false
            );
        }
    }


    /*
     * 결제 결과 화면
     */
    function showResult(payment) {

        if (state.payment) {
            return;
        }


        state.payment =
            payment;


        clearInterval(
            state.poll
        );

        clearInterval(
            state.countdown
        );


        const approved =
            payment.paymentStatus ===
            'APPROVED';


        const resultIcon =
            document.getElementById(
                'resultIcon'
            );


        document.getElementById(
            'resultTitle'
        ).textContent =
            approved
                ? '결제가 완료되었습니다'
                : '결제에 실패했습니다';


        resultIcon.textContent =
            approved
                ? '✓'
                : '!';


        resultIcon.classList.toggle(
            'failure-icon',
            !approved
        );


        if (approved) {

            document.getElementById(
                'resultBox'
            ).innerHTML = `
        <div class="result-line">
          <span>사용 카드</span>
          <strong>
            ${escapeHtml(payment.cardName)}
          </strong>
        </div>

        <div class="result-line">
          <span>결제 금액</span>
          <strong>
            ${won(payment.finalAmount)}
          </strong>
        </div>

        <div class="result-line">
          <span>할인</span>
          <strong>
            ${won(payment.discountAmount)}
          </strong>
        </div>

        <div class="result-line">
          <span>적립 예정</span>
          <strong class="success">
            ${won(payment.rewardAmount)}
          </strong>
        </div>
      `;

        } else {

            document.getElementById(
                'resultBox'
            ).innerHTML = `
        <div class="result-line">
          <span>결제 상태</span>
          <strong>
            승인 거절
          </strong>
        </div>

        <div class="result-line">
          <span>실패 사유</span>
          <strong>
            ${
                escapeHtml(
                    payment.failureReason ||
                    '결제를 처리할 수 없습니다.'
                )
            }
          </strong>
        </div>
      `;
        }


        document.getElementById(
            'resultModal'
        ).classList.remove('hidden');
    }


    /*
     * 결제 금액 변경
     *
     * 북마크 매장 결제일 때만
     * 추천 카드를 다시 계산
     */
    amountInput.addEventListener(
        'change',
        () => {

            if (!state.generalMode) {
                loadCards();
            }
        }
    );


    amountInput.addEventListener(
        'input',
        event => {

            event.target.value =
                event.target.value.replace(
                    /\D/g,
                    ''
                );
        }
    );


    /*
     * 메인 결제 버튼
     */
    mainAction.onclick = () => {

        if (state.token) {
            approvePayment();
            return;
        }

        openPin();
    };


    /*
     * PIN 모달 버튼
     */
    document.getElementById(
        'pinCancel'
    ).onclick =
        closePin;


    document.getElementById(
        'pinConfirm'
    ).onclick =
        verifyAndIssue;


    document.getElementById(
        'pinInput'
    ).oninput =
        event => {

            event.target.value =
                event.target.value
                    .replace(/\D/g, '')
                    .slice(0, 6);
        };


    document.getElementById(
        'pinInput'
    ).onkeydown =
        event => {

            if (event.key === 'Enter') {
                verifyAndIssue();
            }
        };


    /*
     * 결제 방식 탭
     */
    document.getElementById(
        'barcodeTab'
    ).onclick = () => {

        state.mode = 'barcode';

        renderCode();
    };


    document.getElementById(
        'qrTab'
    ).onclick = () => {

        state.mode = 'qr';

        renderCode();
    };




    /*
     * 코드 재발급
     */
    document.getElementById(
        'reissueButton'
    ).onclick =
        issueToken;


    /*
     * 결과 확인
     */
    document.getElementById(
        'resultConfirm'
    ).onclick = () => {

        location.href =
            'index.html';
    };

</script>

</body>
</html>
