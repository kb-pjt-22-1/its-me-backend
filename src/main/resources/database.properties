# 기본값은 별도 설치 없이 실행되는 H2 인메모리 DB입니다.
db.driver=org.h2.Driver
db.url=jdbc:h2:mem:benepay;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
db.username=sa
db.password=

# 환경변수로 덮어쓸 수 있습니다.
# BENEPAY_DB_DRIVER=com.mysql.cj.jdbc.Driver
# BENEPAY_DB_URL=jdbc:mysql://localhost:3306/benepay?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
# BENEPAY_DB_USERNAME=root
# BENEPAY_DB_PASSWORD=1234

demo.mode=true
token.ttlSeconds=60
pin.sessionSeconds=120
pin.maxFailures=5
pin.lockSeconds=300

# 카드 서비스 전달: local 또는 http://host:port/context
card.service.baseUrl=local
internal.api.key=benepay-demo-key
