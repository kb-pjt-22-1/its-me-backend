db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:benepay}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
db.username=${DB_USERNAME:root}
db.password=${DB_PASSWORD:root}

# HS256 needs >= 32 bytes; replace with a securely generated secret before deploying
jwt.secret=${JWT_SECRET:CHANGE-THIS-TO-A-RANDOM-SECRET-OF-AT-LEAST-32-BYTES}
# Must match the `key` registered on the Kong Consumer's JWT credential (Kong's JWT plugin
# looks up the credential by the token's `iss` claim)
jwt.issuer=benepay-auth
# 10 minutes (NFR-SEC-01)
jwt.access-token-expiration=600000
# 1 year (NFR-SEC-01)
jwt.refresh-token-expiration=31536000000

redis.host=${REDIS_HOST:localhost}
redis.port=${REDIS_PORT:6379}
redis.password=${REDIS_PASSWORD:}
# \uC5EC\uAE30\uC11C \uB098\uAC00\uB294 Redis \uD638\uCD9C\uC740 \uC7A0\uAE08 \uCE74\uC6B4\uD130\u00B7refresh \uD1A0\uD070 \uC0C1\uD0DC\u00B7JTI \uBE14\uB799\uB9AC\uC2A4\uD2B8 \uC870\uD68C\uAC00 \uC804\uBD80\uC774\uACE0,
# \uC804\uBD80 \uB85C\uADF8\uC778\uC774\uB098 \uD1A0\uD070 \uAC31\uC2E0\uC744 \uCC98\uB9AC \uC911\uC778 \uC694\uCCAD \uC2A4\uB808\uB4DC\uC5D0\uC11C \uC77C\uC5B4\uB09C\uB2E4. \uC815\uC0C1\uC774\uBA74 1ms \uC548\uC5D0 \uB05D\uB098\uB294
# \uC791\uC5C5\uC774\uB77C \uB354 \uAE30\uB2E4\uB9B0\uB2E4\uACE0 \uC131\uACF5 \uD655\uB960\uC774 \uC62C\uB77C\uAC00\uC9C0 \uC54A\uB294\uB2E4. \uAE30\uB2E4\uB9B0 \uB9CC\uD07C \uC2A4\uB808\uB4DC\uB9CC \uBB36\uC774\uBBC0\uB85C Lettuce
# \uAE30\uBCF8\uAC12\uBCF4\uB2E4 \uACF5\uACA9\uC801\uC73C\uB85C \uB0AE\uCD98\uB2E4.
# \uC815\uC0C1 \uC655\uBCF5\uC758 \uC57D 1000\uBC30. GC \uC815\uC9C0\uB098 \uC21C\uAC04\uC801\uC778 \uB124\uD2B8\uC6CC\uD06C \uC9C0\uC5F0\uC740 \uD761\uC218\uD558\uB418, \uADF8\uBCF4\uB2E4 \uC624\uB798 \uAC78\uB9AC\uB294
# \uD638\uCD9C\uC740 \uC131\uACF5\uC744 \uAE30\uB2E4\uB9AC\uAE30\uBCF4\uB2E4 \uC2E4\uD328\uB85C \uB04A\uB294 \uD3B8\uC774 \uC804\uCCB4 \uC751\uB2F5 \uC2DC\uAC04\uC5D0 \uC720\uB9AC\uD558\uB2E4.
redis.command-timeout-ms=${REDIS_COMMAND_TIMEOUT_MS:2000}
# \uAC19\uC740 \uB3C4\uCEE4 \uB124\uD2B8\uC6CC\uD06C \uC548\uC758 \uC5F0\uACB0\uC774\uB77C, 1\uCD08 \uC548\uC5D0 \uC548 \uBD99\uC73C\uBA74 Redis\uAC00 \uB5A0 \uC788\uC9C0 \uC54A\uB2E4\uACE0 \uBD10\uB3C4 \uBB34\uBC29\uD558\uB2E4.
redis.connect-timeout-ms=${REDIS_CONNECT_TIMEOUT_MS:1000}
# \uBC30\uD3EC\uD560 \uB54C\uB9C8\uB2E4 \uC885\uB8CC\uB97C \uAE30\uB2E4\uB9AC\uB294 \uC2DC\uAC04\uC774\uB77C \uC9E7\uC744\uC218\uB85D \uC88B\uB2E4. \uD504\uB85C\uD37C\uD2F0\uB85C \uBE80 \uC774\uC720\uB294 \uCEE4\uB125\uC158\uC774 \uB298\uC5B4
# \uC774 \uAC12\uC73C\uB85C \uBD80\uC871\uD574\uC84C\uC744 \uB54C \uC7AC\uBE4C\uB4DC \uC5C6\uC774 \uC870\uC815\uD558\uAE30 \uC704\uD568\uC774\uB2E4.
redis.shutdown-timeout-ms=${REDIS_SHUTDOWN_TIMEOUT_MS:100}

# Grace period (ms) for concurrent duplicate refresh requests using the just-rotated-out token (NFR-REL-01)
token.refresh-grace-period-ms=8000

# Static application-wide salt for SHA-256 DI hashing (NFR-SEC-10); keep secret, rotate with care
security.di-hash-salt=${DI_HASH_SALT:CHANGE-THIS-TO-A-RANDOM-SECRET-SALT-VALUE}
# KB Card Mock Server
kb-card.base-url=${KB_CARD_BASE_URL:http://localhost:8081}

# 매장 GEO 인덱스(Redis) 동기화 배치 cron. 기본값: 매일 새벽 4시(Asia/Seoul)
merchant.geo-sync.cron=${MERCHANT_GEO_SYNC_CRON:0 0 4 * * *}
# OpenAI Benefit Coach
openai.api-key=${OPENAI_API_KEY:}
openai.api-url=${OPENAI_API_URL:https://api.openai.com/v1/responses}
openai.model=${OPENAI_MODEL:gpt-4.1-mini}
openai.connect-timeout-ms=${OPENAI_CONNECT_TIMEOUT_MS:3000}
openai.read-timeout-ms=${OPENAI_READ_TIMEOUT_MS:15000}

# Firebase Cloud Messaging (푸시 알림). 서비스 계정 JSON 전체를 한 줄 문자열로 넣는다(파일
# 마운트 대신 - .env/시크릿 매니저로 관리하기 쉽고 어떤 환경에서도 볼륨 마운트가 필요 없다).
# 비어 있으면 FcmPushNotificationSender가 호출 시점에 예외를 던지고, 호출부가 로그만 남기고
# 넘어간다(OpenAI API 키 미설정과 동일한 방식).
firebase.credentials-json=${FIREBASE_CREDENTIALS_JSON:}
