db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/benepay?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
db.username=root
db.password=root

# HS256 needs >= 32 bytes; replace with a securely generated secret before deploying
jwt.secret=CHANGE-THIS-TO-A-RANDOM-SECRET-OF-AT-LEAST-32-BYTES
# Must match the `key` registered on the Kong Consumer's JWT credential (Kong's JWT plugin
# looks up the credential by the token's `iss` claim)
jwt.issuer=benepay-auth
# 10 minutes (NFR-SEC-01)
jwt.access-token-expiration=600000
# 1 year (NFR-SEC-01)
jwt.refresh-token-expiration=31536000000

redis.host=localhost
redis.port=6379
redis.password=

# Grace period (ms) for concurrent duplicate refresh requests using the just-rotated-out token (NFR-REL-01)
token.refresh-grace-period-ms=8000

# PortOne (iamport) identity verification
portone.base-url=https://api.iamport.kr
portone.imp-key=CHANGE-THIS-TO-YOUR-IAMPORT-REST-API-KEY
portone.imp-secret=CHANGE-THIS-TO-YOUR-IAMPORT-REST-API-SECRET

# Static application-wide salt for SHA-256 DI hashing (NFR-SEC-10); keep secret, rotate with care
security.di-hash-salt=CHANGE-THIS-TO-A-RANDOM-SECRET-SALT-VALUE
